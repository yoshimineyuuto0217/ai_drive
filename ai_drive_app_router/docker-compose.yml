services:
  backend:
    build:
      context: ./backend
    ports:
      - "3003:3003"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/qiita_app_approuter
      PORT: 3003
      FRONTEND_ORIGIN: http://localhost:3002
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qiita_app_approuter
    volumes:
      - postgres_data_approuter:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qiita_app_approuter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_approuter:
